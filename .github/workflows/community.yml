name: Test Bicep Template for Community Edition

# This workflow validates Neo4j Community Edition deployments using:
# - Bicep templates (compiled to ARM JSON)
# - Python-based validation (validate_deploy)
#
# Test scenario:
# - Standalone Community Edition (1 node, standalone VM)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - marketplace/neo4j-ce/**
      - scripts/neo4j-ce/**
      - deployments/**
      - .github/workflows/community.yml
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

env:
  TEMPLATE_PATH: marketplace/neo4j-ce
  DEPLOYMENTS_PATH: deployments

jobs:
  test-template-standalone-ce-lts:
    name: Test ARM (Neo4j CE Standalone)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ResourceGroupLocation: eastus2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/uv
          key: ${{ runner.os }}-uv-0.9.x

      - name: Install uv
        run: |
          set -euo pipefail
          if [ ! -f ~/.local/bin/uv ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify uv installation
        run: |
          uv --version

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          cd ${{ env.DEPLOYMENTS_PATH }}
          uv sync

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Resource Group and Deployment variables
        id: variables
        run: |
          set -euo pipefail
          TIMESTAMP=$(date '+%Y%m%d-%H%M%S')
          RGNAME="ghactions-ce-rg-${TIMESTAMP}-${{ github.run_id }}-${{ github.run_attempt }}"
          DEPNAME="ghactions-ce-dep-${TIMESTAMP}"
          echo "rgName=${RGNAME}" >> $GITHUB_OUTPUT
          echo "depName=${DEPNAME}" >> $GITHUB_OUTPUT
          echo "Resource Group name: ${RGNAME}"
          echo "Deployment name: ${DEPNAME}"

      - name: Create Resource Group
        uses: Azure/CLI@v1
        with:
          inlineScript: |
            set -euo pipefail
            az group create --name ${{ steps.variables.outputs.rgName }} --location ${{ env.ResourceGroupLocation }}
            echo "Azure resource group created"

      - name: Compile Bicep template to ARM JSON
        run: |
          set -euo pipefail
          cd ${{ env.TEMPLATE_PATH }}
          az bicep build --file main.bicep --outfile mainTemplate-generated.json
          echo "Bicep template compiled successfully"

      - name: Deploy ARM Template (Neo4j CE Standalone Latest)
        id: deployARM
        uses: azure/arm-deploy@v1
        with:
          resourceGroupName: ${{ steps.variables.outputs.rgName }}
          template: ./${{ env.TEMPLATE_PATH }}/mainTemplate-generated.json
          parameters: ./${{ env.TEMPLATE_PATH }}/parameters.json graphDatabaseVersion="latest"
          deploymentName: ${{ steps.variables.outputs.depName }}

      - name: Check VM provisioning status
        run: |
          echo "=== Checking VM provisioning status ==="
          VM_NAME="${{ steps.deployARM.outputs.vmName }}"
          RG_NAME="${{ steps.variables.outputs.rgName }}"

          echo "VM: $VM_NAME"
          echo "Resource Group: $RG_NAME"
          echo ""

          echo "Checking VM status..."
          az vm show --name "$VM_NAME" --resource-group "$RG_NAME" --show-details --output table || true

      - name: Validate deployment
        run: |
          set -euo pipefail

          BROWSER_URL="${{ steps.deployARM.outputs.neo4jBrowserURL }}"
          HOSTNAME=$(echo "$BROWSER_URL" | sed 's#http://##;s#:.*##')
          VM_NAME="${{ steps.deployARM.outputs.vmName }}"
          RG_NAME="${{ steps.variables.outputs.rgName }}"

          echo "=== Deployment Information ==="
          echo "Browser URL: $BROWSER_URL"
          echo "Hostname: $HOSTNAME"
          echo "VM: $VM_NAME"
          echo ""

          # Wait and check connectivity in a loop
          # CE uses cloud-init to install Neo4j from yum, so allow extra time
          echo "=== Waiting for Neo4j to be ready (max 25 minutes) ==="
          MAX_ATTEMPTS=150  # 150 * 10 seconds = 25 minutes
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Checking connectivity..."

            # Check DNS resolution (skip if hostname is an IP address)
            if [[ ! "$HOSTNAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              if ! nslookup "$HOSTNAME" > /dev/null 2>&1; then
                echo "  DNS resolution failed"
                sleep 10
                continue
              fi
              echo "  DNS resolved"
            else
              echo "  Hostname is an IP address, skipping DNS check"
            fi

            if ! nc -z -w5 "$HOSTNAME" 7687 > /dev/null 2>&1; then
              echo "  Port 7687 not accessible"
              sleep 10
              continue
            fi
            echo "  Port 7687 is open"

            if curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$BROWSER_URL" | grep -q "200\|404"; then
              echo "  HTTP endpoint responding"
              echo "  Neo4j appears to be ready!"
              break
            else
              echo "  HTTP endpoint not responding yet"
            fi

            sleep 10
          done

          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo ""
            echo "=== ERROR: Neo4j did not become ready within 25 minutes ==="
            echo ""
            echo "Checking VM status..."
            az vm show --name "$VM_NAME" --resource-group "$RG_NAME" --show-details --output table || true
            echo ""
            echo "Attempting to retrieve cloud-init logs from VM..."
            az vm run-command invoke \
              --resource-group "$RG_NAME" \
              --name "$VM_NAME" \
              --command-id RunShellScript \
              --scripts "echo '=== Cloud-init status ==='; cloud-init status; echo ''; echo '=== Last 100 lines of cloud-init log ==='; tail -100 /var/log/cloud-init-output.log; echo ''; echo '=== Neo4j service status ==='; systemctl status neo4j || true" \
              --query 'value[0].message' \
              --output tsv || echo "Failed to retrieve logs"
            exit 1
          fi

          URI=$(echo "$BROWSER_URL" | sed 's/http/bolt/g;s/7474\//7687/g')
          PASSWORD=$(cat ./${{ env.TEMPLATE_PATH }}/parameters.json | jq -r .adminPassword.value)

          echo ""
          echo "=== Running Neo4j Validation ==="
          echo "URI: $URI"
          cd ${{ env.DEPLOYMENTS_PATH }}
          uv run validate_deploy "${URI}" "neo4j" "${PASSWORD}" "Community"

      - name: Delete Resource Group
        if: always()
        uses: Azure/CLI@v1
        with:
          inlineScript: |
            set -euo pipefail
            az group delete --name ${{ steps.variables.outputs.rgName }} --yes
            echo "Azure resource group deleted"
