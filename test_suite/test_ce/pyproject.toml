[project]
name = "test-ce"
version = "0.1.0"
description = "Integration tests for the Neo4j CE Azure deployment"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.25.0",
    "requests>=2.32.0",
    "azure-identity>=1.17.0",
    "azure-mgmt-compute>=33.0.0",
]

[project.scripts]
test-ce = "test_ce.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_ce"]
